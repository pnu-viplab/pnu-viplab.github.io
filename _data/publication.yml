# Publication data
# Format in text fields:
#   **text**     → <strong>text</strong>
#   [text](url)  → <a href="url">text</a>
# type: intl | other | domestic
# links: list of {label, url}  — omit url to render as gray (unavailable)
#
# authors: reference lab members by their _data/team.yml "id", prefixed with @.
#   Each @id renders in bold, links to that member's page, and picks the
#   language from "type": English name for intl/other, Korean for domestic.
#   The PI uses the special id @prof_jspark. Authors outside the lab are
#   written out by name; [Name](url) still works for linking them.
#   Markers stay attached to the token: "@subin_lee_2024*" plus a trailing
#   "[* Equal Contribution]" note. An unknown id renders as the raw "@id".
#     authors: "@heeju_han_2024, @ajeong_kim_2025, and @prof_jspark"
#     authors: "@yejun_jung_2025*, Some Collaborator, and @prof_jspark [* Equal Contribution]"
#
# research: slug of the matching document in _research/ (its front matter
#   "slug"). When set, the title links to that research page. Omit it when the
#   paper has no research page; an unknown slug is ignored and logged.
#     research: "0014-sparsely-annotated-open-world-object-detection"

